<!DOCTYPE html> 
<html lang="fr">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Compte à rebours</title>
        <link rel="stylesheet" href="style.css">

    </head>
    <body>

        <div class="container">
            <div class="countdown" id="countdown"></div>
            <div class="invite-card" id="inviteCard">
                <button class="arrow-btn" id="arrowBtn" onclick="toggleCard()">↓</button>
                <div class="card-content">
                    <button class="button" id="btn" data-front="Italiano" data-back="Français">
                        Italino
                    </button>
                    <div class="scene" id="cardScene">
                        <div class="card">
                            <div class="face front">
                                <p>
                                    Bonjour!
                                </p> 
                            </div>
                            <div class="face back">
                                <p> 
                                    Ciao
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script src="script.js"></script>
    </body>
</html>
